[project]
name = "ghost-bus-tracker"
version = "0.1.0"
description = "Automated public transit reliability and ghost bus tracker using GTFS & GTFS-RT feeds."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Amin" }
]
keywords = ["gtfs", "gtfs-realtime", "transit", "ghost-bus", "reliability", "metro-transit", "git-scraping"]
requires-python = ">=3.10"
dependencies = [
    "gtfs-realtime-bindings>=2.2.0",
    "protobuf>=5.29.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
ghost-bus = "src.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
